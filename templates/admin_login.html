{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<img class="top-img" src="{{ url_for('static', filename='images/admin.png') }}" alt="Admin dashboard with pass counts">

<div class="login-box">
    <h2>Admin Login</h2>

    {% for e in errors %}
        <div class="msg msg-err">{{ e }}</div>
    {% endfor %}

    <form action="{{ url_for('adminLogin') }}" method="post">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}
