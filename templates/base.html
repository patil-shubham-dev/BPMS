<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Bus Pass Management System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <div class="navbar-box">
            <span class="navbar-title">Bus Pass Management System</span>
            <div class="navbar-links">
                <a href="{{ url_for('home') }}" {% if request.path == '/' %}class="active"{% endif %}>Home</a>
                <a href="{{ url_for('register') }}" {% if request.path == '/register' %}class="active"{% endif %}>Register</a>
                <a href="{{ url_for('search') }}" {% if request.path == '/search' %}class="active"{% endif %}>Search</a>
                <a href="{{ url_for('renew') }}" {% if request.path == '/renew' %}class="active"{% endif %}>Renew</a>
                <a href="{{ url_for('cancel') }}" {% if request.path == '/cancel' %}class="active"{% endif %}>Cancel</a>
                <a href="{{ url_for('admin') }}" {% if request.path in ['/admin', '/admin-login'] %}class="active"{% endif %}>Admin</a>
            </div>
        </div>
    </div>

    <div class="page {% block pageclass %}{% endblock %}">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        <p>Bus Pass Management System | college mini project</p>
    </div>
</body>
</html>
