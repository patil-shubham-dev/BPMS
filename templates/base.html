<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Bus Pass Management System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <div class="navbar-box">
            <!-- logo picture can be added here later,
                 put the file in static/images first, for example:
                 <img src="/static/images/logo.png" alt="logo"> -->
            <span class="navbar-title">Bus Pass MS</span>
            <div class="navbar-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('register') }}">Register</a>
                <a href="{{ url_for('search') }}">Search</a>
                <a href="{{ url_for('renew') }}">Renew</a>
                <a href="{{ url_for('cancel') }}">Cancel</a>
                <a href="{{ url_for('admin') }}">Admin</a>
            </div>
        </div>
    </div>

    <div class="page">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        <p>Bus Pass Management System | college mini project</p>
    </div>
</body>
</html>
