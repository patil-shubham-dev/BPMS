<!DOCTYPE html>
<html>
<head>
    <title>Bus Pass Management System</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <h1>Bus Pass Management System</h1>

    <!-- the C program output appears here -->
    {{result}}

    <div class="forms">
        <form action="/register" method="post">
            <h2>Register Student</h2>
            <input type="text" name="name" placeholder="Student Name" required>
            <input type="number" name="age" placeholder="Age" required>
            <input type="text" name="college" placeholder="College Name" required>
            <input type="text" name="course" placeholder="Course" required>
            <input type="text" name="year" placeholder="Year" required>
            <input type="text" name="mobile" placeholder="Mobile Number" maxlength="15" required>
            <input type="text" name="source" placeholder="Source Bus Stop" required>
            <input type="text" name="destination" placeholder="Destination Bus Stop" required>
            <button type="submit">Register</button>
        </form>

        <form action="/search" method="post">
            <h2>Search Student</h2>
            <input type="text" name="query" placeholder="Student ID or Name" required>
            <button type="submit">Search</button>
        </form>

        <form action="/renew" method="post">
            <h2>Renew Bus Pass</h2>
            <input type="text" name="id" placeholder="Student ID" required>
            <input type="number" name="months" placeholder="Months" min="1" required>
            <button type="submit">Renew</button>
        </form>

        <form action="/cancel" method="post">
            <h2>Cancel Bus Pass</h2>
            <input type="text" name="id" placeholder="Student ID" required>
            <button type="submit" class="cancel">Cancel</button>
        </form>
    </div>
</body>
</html>
